name: Compose Preview

# Renders every module that applies `ee.schimke.composeai.preview` — the catalog
# plus the libraries that carry their own `src/debug` previews — and turns the
# result into review material:
#
#  - push to `main`  → publish the rendered PNGs as the baseline, on a
#                      `compose-preview/…` branch. This is the "before" state
#                      every later PR is diffed against.
#  - pull_request    → render the PR head, diff it against that baseline, and
#                      post a single sticky comment showing New / Changed /
#                      Removed previews inline.
#
# So a PR that changes a composable gets its before/after pixels posted
# automatically, without anyone remembering to attach screenshots.
#
# The `apply` action installs the compose-preview CLI at exactly the plugin
# version pinned in `gradle/libs.versions.toml` (`cli-version: auto`), so the
# CLI and the applied plugin can never skew.

#  - push to `previews` → render on every commit and upload the PNGs as an
#                         artifact. A scratch branch for iterating on preview
#                         code without opening a PR or disturbing the baseline.
on:
  push:
    branches: [main, previews]
    paths-ignore:
      - '**.md'
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# Nothing by default — each job asks for exactly what it needs. This matters
# for the fork path below: a workflow-level write grant would be handed to the
# job that runs the PR's own Gradle build if the org ever enables write tokens
# for fork pull requests.
permissions: {}

concurrency:
  # Per-PR group so concurrent PRs don't cancel each other; push and dispatch
  # share one slot per ref.
  group: compose-preview-${{ github.event.pull_request.number || github.ref }}
  # PR runs cancel — a new push supersedes the render and the comment is
  # sticky, so only the newest result matters. Baseline runs on `main` must
  # not: cancelling one strands the baseline at an older commit, and every
  # later PR then reports the skipped commits' output as its own diff.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Fast per-commit render of just `:catalog`, for the `previews` scratch branch.
  # The full `apply` job below sweeps every module in the build and takes ~10x
  # as long, which is the wrong loop when you're iterating on catalog code — this
  # renders the one module and hands back the PNGs as an artifact.
  catalog:
    name: Render catalog
    if: github.ref == 'refs/heads/previews' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: 'true'
          persist-credentials: false

      - name: Copy CI gradle.properties
        run: mkdir -p ~/.gradle ; cp .github/ci-gradle.properties ~/.gradle/gradle.properties

      - name: set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Render catalog previews
        uses: gradle/gradle-build-action@v3
        with:
          arguments: :catalog:composePreviewRenderAll

      - name: Upload rendered previews
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: catalog-previews
          path: catalog/build/compose-previews/renders/
          if-no-files-found: error

  # Fork PRs render here and publish nothing.
  #
  # A fork PR's GITHUB_TOKEN is read-only on every scope, so the `apply` job
  # below cannot push its renders or post its comment for one — it fails on the
  # push and the PR gets no preview at all. `pull_request_target` looks like the
  # fix and is not: it would hand a write-scoped token to a job that checks out
  # and builds the PR's own code.
  #
  # So this job renders and stops, and `compose-preview-publish.yml` picks the
  # result up from a `workflow_run` and publishes it from `main`'s own code.
  # Its `permissions` block is what keeps the isolation real: an org can enable
  # write tokens for fork PRs, and this job must not receive them.
  render-fork:
    name: Render previews (fork PR)
    if: ${{ github.ref != 'refs/heads/previews' && github.event.pull_request.head.repo.fork }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: 'true'
          persist-credentials: false

      - name: Copy CI gradle.properties
        run: mkdir -p ~/.gradle ; cp .github/ci-gradle.properties ~/.gradle/gradle.properties

      - name: set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 21

      - uses: yschimke/compose-ai-tools/.github/actions/apply@main
        with:
          phase: render
          # Kept in step with the `apply` job below — these are render-side
          # settings, so they belong on this call, not the publish one.
          only: compose
          timeout: '1800'
          missing-renders: fail

      - name: Upload preview handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: compose-preview-handoff
          path: _compose_preview_handoff/
          if-no-files-found: error
          retention-days: 1

  apply:
    name: Apply compose-preview
    # Baselines come from `main` and diff comments from PRs; the `previews`
    # scratch branch runs the cheap `catalog` job above instead. Fork PRs go
    # through `render-fork` — this job holds the write token, so it only ever
    # runs on code that already had commit access.
    if: ${{ github.ref != 'refs/heads/previews' && !github.event.pull_request.head.repo.fork }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      # Baseline mode pushes rendered PNGs to `compose-preview/…` branches.
      contents: write
      # Comment mode posts (and updates) the sticky diff comment.
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: 'true'
          # The action pushes via an explicit token in the remote URL, so the
          # default git credentials aren't needed here.
          persist-credentials: false

      - name: Copy CI gradle.properties
        run: mkdir -p ~/.gradle ; cp .github/ci-gradle.properties ~/.gradle/gradle.properties

      - name: set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 21

      - uses: yschimke/compose-ai-tools/.github/actions/apply@main
        with:
          # Only the compose pipeline. The a11y / notifications / resources
          # pipelines are additional renders on top of this one; turn them on
          # separately once the compose baseline is settled.
          only: compose
          # Safety ceiling against a hung build, not a budget — the render is
          # well under this on a healthy runner.
          timeout: '1800'
          # The default. This was `warn` for one reason: the CLI auto-injects
          # the plugin into *every* module in the build, not just the ten that
          # opt in, so the render also picks up the sample apps, and
          # `:ai:sample:wear-gemini`'s `DefaultPreview` previewed `WearApp()` —
          # a Hilt-backed activity entry point — and produced no output, which
          # sank the whole run and with it the baseline push (run #1 died
          # exactly there). That preview now renders: its state is hoisted out
          # of `WearApp`, so there is nothing left for `warn` to excuse and a
          # preview that stops rendering should fail the run rather than
          # scroll past in a log.
          missing-renders: fail
